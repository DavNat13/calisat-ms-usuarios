spring:
  application:
    name: calisat-ms-usuarios
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/calisat_usuarios}
    username: ${SPRING_DATASOURCE_USERNAME:calisat_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:calisat_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/}
          tenant-id: ${JWT_TENANT_ID:e5372bf0-c5e3-4286-887c-79069f209c1f}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
