version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: calisat-db-usuarios
    environment:
      POSTGRES_DB: calisat_usuarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - calisat_usuarios_data:/var/lib/postgresql/data
    networks:
      - calisat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calisat_usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calisat-ms-usuarios
    ports:
      - "8081:8080"
    environment:
      # Broker: cluster de calisat-infra/rabbitmq-cluster (red calisat-net).
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-calisat-rabbit1}
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-calisat-app}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-Calisat2026!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - calisat-net

networks:
  calisat-net:
    name: calisat-net
    driver: bridge

volumes:
  calisat_usuarios_data:
